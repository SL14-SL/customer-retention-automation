[project]
name = "customer-retention-automation"
version = "1.0.0"
description = "End-to-end customer retention automation with synthetic churn simulation, FastAPI, n8n human approvals, and Streamlit dashboards."
readme = "README.md"
authors = [
    { name = "Steffen Lauterbach", email = "slauterbach.mlengineering@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "fastapi>=0.165.0",
    "pandas>=3.1.1",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
