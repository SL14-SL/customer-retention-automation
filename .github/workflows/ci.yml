
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    env:
      RETENTION_API_KEY: ci-placeholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check src tests scripts retention_dashboard.py

      - name: Lint
        run: uv run ruff check src tests scripts retention_dashboard.py

      - name: Run tests
        run: uv run pytest -q

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build api
